name: Deployment Cleanup

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  deployments: write

jobs:
  delete-deployments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              console.log('Listing deployments');
              const { data } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'dev',
              });

              console.log(`Found ${data.length} deployments`);

              for (const deployment of data) {
                console.log(`Deactivating deployment ${deployment.id}`);
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Deactivated by cleanup workflow',
                })
                console.log(`Deleting deployment ${deployment.id}`);
                await github.rest.repos.deleteDeployment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                });
            } catch (error) {
              console.error(error);
            }
