name: PR

on:
  pull_request:
    types: [labeled, opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Hello, world!"

      - uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: 'eliasbrange',
              repo: 'mise-ci-test',
              environment: 'dev',
              sha: ${{ github.sha }},
            });
            console.log(deployments);
