name: PR

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  deployments: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Hello, world!"

  test2:
    runs-on: ubuntu-latest
    needs: test
    environment: staging
    steps:
      - run: echo "Hello, world!"

  test3:
    runs-on: ubuntu-latest
    needs: test2
    environment: dev
    steps:
      - run: echo "Hello, world!"
